name: CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  windows-mcp:
    name: Windows MCP executor diagnostics
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Build mcp-server lib tests
        shell: bash
        run: cargo test -p mcp-server --lib --no-run
      - name: Python identity (no launch of the interpreter)
        shell: bash
        run: |
          type -a python || true
          ls -la "$(command -v python)" || true
      - name: Cold run — check_executor_windows_tests as in CI, with marker latency
        shell: bash
        run: |
          set +e
          cargo test -p mcp-server --lib -- check_executor_windows_tests --nocapture 2>&1 | tee cold.log
          echo "exit=${PIPESTATUS[0]}"
      - name: Python launch latency after the cold run
        shell: bash
        run: |
          python -VV
          for i in 1 2 3 4; do
            ( s=$(date +%s%N); python -c "import ctypes, json, os, subprocess, sys, time"; e=$(date +%s%N); echo "concurrent $i: $(( (e - s) / 1000000 )) ms" ) &
          done
          wait
          for i in 1 2 3; do
            s=$(date +%s%N); python -c "import ctypes, json, os, subprocess, sys, time"; e=$(date +%s%N); echo "sequential $i: $(( (e - s) / 1000000 )) ms"
          done
      - name: Positive control — fake executor startup delayed 6 s
        shell: bash
        env:
          BSL_DIAG_STARTUP_DELAY: "6"
        run: |
          set +e
          cargo test -p mcp-server --lib -- check_executor_windows_tests --nocapture 2>&1 | tee delayed.log
          echo "exit=${PIPESTATUS[0]}"
      - name: Warm run — no delay
        shell: bash
        run: |
          set +e
          cargo test -p mcp-server --lib -- check_executor_windows_tests --nocapture 2>&1 | tee warm.log
          echo "exit=${PIPESTATUS[0]}"

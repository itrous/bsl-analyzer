name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: python3 scripts/test-ci-test-output.py
      - run: cargo clippy --all-targets --all-features
      - name: Portable workspace lease profiles
        run: |
          set -euo pipefail
          run_exact() {
            # `set -e` aborts the function on the ASSIGNMENT when cargo fails, before the
            # print below — so the failing test's output never reaches the log. Take the
            # status by hand, print, and only then decide.
            local output status
            output=$(cargo test -p mcp-server --lib "$1" -- --exact 2>&1) && status=0 || status=$?
            printf '%s\n' "$output"
            if [ "$status" -ne 0 ]; then
              echo "::error::$1 failed with status $status"
              return "$status"
            fi
            grep -Eq 'test result: ok\. [1-9][0-9]* passed' <<<"$output"
          }
          run_exact workspace_lease::tests::contention_unclaimed_and_missing_are_transient
          run_exact workspace_lease::tests::a_throttled_checkpoint_still_reports_a_release
          run_exact graph::snapshot::tests::path_identity_detects_equal_size_and_time_replacement
          run_exact tools::graph::tests::graph_data_requests_are_pool_only_under_held_lease
          run_exact tools::search::tests::all_search_modes_are_resident_only_under_held_lease
          run_exact tests::all_status_requests_are_cached_under_held_lease
          run_exact inventory::no_generic_or_unclassified_production_lease_callers
          run_exact inventory::fence_callers_are_exactly_classified
          run_exact inventory::request_paths_do_not_call_lease_or_mutation_helpers
          run_exact inventory::production_source_handles_checkout_line_endings
          run_exact inventory::production_source_keeps_the_request_handlers_of_lib_rs
          run_exact inventory::production_source_drops_the_test_modules_of_real_sources
          run_exact inventory::the_request_path_gate_fails_on_an_injected_lease_call
          run_exact state::embed::tests::prepared_index_survives_transient_swap_without_rebuild
      - name: Drift contract
        run: |
          set -euo pipefail
          # Exact names, each required to run at least one test: a renamed or moved test
          # would otherwise match nothing and pass.
          run_exact() {
            local output status
            output=$(cargo test -p "$1" --lib "$2" -- --exact 2>&1) && status=0 || status=$?
            printf '%s\n' "$output"
            if [ "$status" -ne 0 ]; then
              echo "::error::$2 failed with status $status"
              return "$status"
            fi
            grep -Eq 'test result: ok\. [1-9][0-9]* passed' <<<"$output"
          }
          run_exact mcp-server state::background_lifetime_tests::shutdown_stops_every_owner_within_a_second
          run_exact mcp-server change_hub::tests::interrupted_waiters_return_at_once_and_stay_released
          run_exact mcp-server change_hub::tests::a_hub_without_a_watch_polls_after_one_reconcile
          run_exact mcp-server change_hub::tests::a_same_stat_edit_is_found_by_the_content_check_once
          run_exact mcp-server graph::state::tests::marks_are_consumed_by_an_observing_publication_in_every_order
          run_exact mcp-server graph::watcher::tests::marks_placed_after_the_graph_caught_up_on_its_own_are_consumed_at_once
          run_exact mcp-server graph::watcher::tests::owed_marks_force_a_rebuild_of_an_unchanged_graph
          run_exact mcp-server graph::watcher::tests::a_stalled_search_cursor_costs_the_hub_its_capacity_at_most_and_the_graph_nothing
          run_exact mcp-server state::bootstrap::tests::a_quiet_healthy_boot_asks_for_no_reconcile_mark_or_reload
          run_exact mcp-server state::bootstrap::tests::the_graph_follows_edits_after_search_init_failed
          run_exact mcp-server state::bootstrap::tests::a_workspace_without_a_watch_follows_edits_through_the_poll
          run_exact mcp-server state::bootstrap::tests::a_superseded_daemon_applies_nothing_more_and_releases_its_cursors
          run_exact mcp-server state::bootstrap::tests::the_search_and_the_graph_say_who_watches_them
          run_exact mcp-server state::overlay_backlog::tests::a_large_backlog_drains_without_pauses_between_batches
          run_exact mcp-server state::overlay_backlog::tests::a_held_writer_lock_refuses_the_commit_and_a_stop_is_answered_during_the_backoff
          run_exact mcp-server state::overlay_backlog::tests::point_batches_and_full_plans_do_not_roll_each_other_back

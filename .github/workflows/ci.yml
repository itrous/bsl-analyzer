name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features
      - name: Portable workspace lease profiles
        run: |
          cargo test -p mcp-server workspace_lease::tests::contention_unclaimed_and_missing_are_transient -- --exact
          cargo test -p mcp-server workspace_lease::tests::release_signal_precedes_lifecycle_wait -- --exact
          cargo test -p mcp-server graph::snapshot::tests::path_identity_detects_equal_size_and_time_replacement -- --exact
          cargo test -p mcp-server tools::graph::tests::graph_data_requests_are_pool_only_under_held_lease -- --exact
          cargo test -p mcp-server tools::search::tests::all_search_modes_are_resident_only_under_held_lease -- --exact
          cargo test -p mcp-server tests::all_status_requests_are_cached_under_held_lease -- --exact
      - run: cargo test --all --no-fail-fast

  windows-mcp:
    name: Windows MCP transports + secure broker
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build binary
        run: cargo build -p bsl-analyzer --bin bsl-analyzer-app
      - name: CLI MCP mode and lifecycle tests
        run: cargo test -p bsl-analyzer --bin bsl-analyzer-app cli::mcp
      - name: Diagnostics baseline atomic create
        run: cargo test -p bsl-analyzer diagnostics_baseline_create
      - name: Diagnostics baseline atomic update
        run: cargo test -p bsl-analyzer diagnostics_baseline_update
      - name: Partitioned diagnostics baseline transaction
        run: cargo test -p bsl-analyzer partitioned_baseline_transaction
      - name: Selective diagnostics baseline transaction
        run: cargo test -p bsl-analyzer selective_baseline_transaction
      - name: Selective baseline path security
        run: cargo test -p project-model partitioned_baseline_path_security && cargo test -p ide selective_loader_rejects_unsafe_enabled_paths_and_links
      - name: HTTP transport tests
        run: cargo test -p mcp-server --test http
      - name: Broker runtime tests
        run: cargo test -p mcp-server --test broker
      - name: Superseded workspace lease lifecycle
        run: >-
          cargo test -p mcp-server workspace_lease::tests::observed_foreign_owner_is_permanent &&
          cargo test -p mcp-server workspace_lease::tests::publish_fence_latches_supersession &&
          cargo test -p mcp-server workspace_lease::tests::observed_owner_race_cannot_reclaim &&
          cargo test -p mcp-server workspace_lease::tests::transient_unclaimed_is_not_superseded &&
          cargo test -p mcp-server workspace_lease::tests::non_witness_states_remain_reclaimable
      - name: Fenced search construction and apply
        run: >-
          cargo test -p bsl-search engine::tests::workspace_constructor_publish_fence &&
          cargo test -p mcp-server state::bootstrap::tests::startup_constructor_fence_distinguishes_retry_terminal_and_error &&
          cargo test -p mcp-server state::bootstrap::tests::startup_metadata_fence_stops_after_takeover &&
          cargo test -p mcp-server state::bootstrap::tests::startup_ingest_fence_does_not_repeat_preparation &&
          cargo test -p mcp-server state::bootstrap::tests::superseded_bootstrap_stops_mutating &&
          cargo test -p mcp-server state::sync::tests::superseded_daemon_cannot_mutate_shared_search &&
          cargo test -p mcp-server search_code_does_not_write_after_supersession
      - name: Terminal graph snapshot lifecycle
        run: >-
          cargo test -p mcp-server graph::state::tests::superseded_graph_never_adopts_or_reloads &&
          cargo test -p mcp-server graph::state::tests::superseded_late_publish_is_fenced &&
          cargo test -p mcp-server graph::build::tests::superseded_fused_writer_stops_mutating &&
          cargo test -p mcp-server graph::build::tests::superseded_build_is_discarded_after_owner_release &&
          cargo test -p mcp-server graph::snapshot::tests::superseded_graph_serves_only_preopened_snapshot &&
          cargo test -p mcp-server graph::state::tests::superseded_status_truth_table &&
          cargo test -p mcp-server graph_actions_fail_when_superseded_snapshot_is_gone
      - name: Terminal retry embedding and broker lifecycle
        run: >-
          cargo test -p mcp-server state::overlay_retry::tests::observed_supersession_never_resumes &&
          cargo test -p bsl-search engine::tests::embedding_publish_fence &&
          cargo test -p mcp-server state::embed::tests::embedding_fence_distinguishes_retry_from_supersession &&
          cargo test -p mcp-server state::tests::terminal_supersession_is_not_transient_nonownership &&
          cargo test -p mcp-server --test broker superseded_backend_lifecycle
      - name: Workspace lease operation semantics portable regressions
        run: >-
          cargo test -p mcp-server workspace_lease::tests::release_during_checkpointed_callback_rolls_back_as_terminal -- --exact &&
          cargo test -p mcp-server workspace_lease::tests::release_waits_for_only_the_admitted_batch_and_refuses_the_next -- --exact &&
          cargo test -p mcp-server workspace_lease::tests::takeover_between_batches_preserves_the_first_and_terminates_the_next -- --exact &&
          cargo test -p mcp-server state::bootstrap::tests::startup_constructor_fence_distinguishes_retry_terminal_and_error -- --exact &&
          cargo test -p mcp-server state::sync::tests::background_snapshot_failures_require_rescan_instead_of_empty_xml_success -- --exact &&
          cargo test -p mcp-server state::embed::tests::embedding_fence_distinguishes_retry_from_supersession -- --exact &&
          cargo test -p mcp-server state::overlay_retry::tests::transient_budget_fails_once_ignores_active_kicks_and_rearms_on_new_drift -- --exact &&
          cargo test -p mcp-server graph::snapshot::tests::path_identity_detects_equal_size_and_time_replacement -- --exact &&
          cargo test -p mcp-server graph::snapshot::tests::final_install_rechecks_token_through_the_preopened_descriptor -- --exact &&
          cargo test -p mcp-server graph::snapshot::tests::publication_without_a_complete_descriptor_pool_cannot_be_ready -- --exact &&
          cargo test -p mcp-server graph::build::tests::incremental_publish_propagates_transient_refusal -- --exact &&
          cargo test -p mcp-server graph::build::tests::fresh_and_cached_publication_paths_propagate_final_install_refusal -- --exact &&
          cargo test -p mcp-server graph_supersession_contract::graph_handler_misses_immediately_when_preopened_handles_are_busy -- --exact &&
          cargo test -p mcp-server graph_supersession_contract::resolve_names_misses_immediately_when_preopened_handles_are_busy -- --exact &&
          cargo test -p mcp-server graph_supersession_contract::symbol_info_misses_immediately_when_preopened_handles_are_busy -- --exact
      - name: Portable workspace lease profiles
        run: >-
          cargo test -p mcp-server workspace_lease::tests::contention_unclaimed_and_missing_are_transient -- --exact &&
          cargo test -p mcp-server workspace_lease::tests::release_signal_precedes_lifecycle_wait -- --exact &&
          cargo test -p mcp-server graph::snapshot::tests::path_identity_detects_equal_size_and_time_replacement -- --exact &&
          cargo test -p mcp-server tools::graph::tests::graph_data_requests_are_pool_only_under_held_lease -- --exact &&
          cargo test -p mcp-server tools::search::tests::all_search_modes_are_resident_only_under_held_lease -- --exact &&
          cargo test -p mcp-server tests::all_status_requests_are_cached_under_held_lease -- --exact

  partitioned-baseline-scale:
    name: Partitioned baseline 1.6M release gate
    # Four release runs that each materialise a 1.6M-entry object: minutes of CPU and
    # hundreds of megabytes of disk. Kept off pull requests, where it would run on every
    # push to every branch, and still guarding `develop` after a merge (plus on demand).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ide --release --test partitioned_baseline_scale -- --ignored
      - run: cargo test -p ide --release --test selective_baseline_scale large_selective_baseline_load_skips_unsuppressed_objects -- --ignored --exact
      - run: cargo test -p bsl-analyzer --release --test partitioned_baseline_scale -- --ignored
      - run: cargo test -p bsl-analyzer --release --test selective_baseline_scale large_selective_v1_migration_streams_skipped_entries_with_bounded_rss -- --ignored --exact

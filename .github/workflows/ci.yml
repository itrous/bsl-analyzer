  partitioned-baseline-scale:
    name: Partitioned baseline 1.6M release gate
    # Four release runs that each materialise a 1.6M-entry object: minutes of CPU and
    # hundreds of megabytes of disk. Kept off pull requests, where it would run on every
    # push to every branch, and still guarding `develop` after a merge (plus on demand).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ide --release --test partitioned_baseline_scale -- --ignored
      - run: cargo test -p ide --release --test selective_baseline_scale large_selective_baseline_load_skips_unsuppressed_objects -- --ignored --exact
      - run: cargo test -p bsl-analyzer --release --test partitioned_baseline_scale -- --ignored
      - run: cargo test -p bsl-analyzer --release --test selective_baseline_scale large_selective_v1_migration_streams_skipped_entries_with_bounded_rss -- --ignored --exact

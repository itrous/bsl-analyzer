[workspace]
resolver = "2"
members = [
    "crates/*",
    "crates/bsl-platform/tools/html-parser",
    "xtask",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["BSL Analyzer Contributors"]
repository = "https://github.com/itrous/bsl-analyzer"
rust-version = "1.95"

[workspace.lints.rust]
# `--cfg corpus_contract` selects the tests that need the platform help corpus;
# see docs/contributing/DEVELOPMENT_RULES.md.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(corpus_contract)'] }

[workspace.dependencies]
bsl-analyzer = { path = "crates/bsl-analyzer" }
syntax = { path = "crates/syntax" }
parser = { path = "crates/parser" }
lexer = { path = "crates/lexer" }
parser-error = { path = "crates/parser-error" }
base-db = { path = "crates/base-db" }
bsl-config = { path = "crates/bsl-config" }
bsl-conventions = { path = "crates/bsl-conventions" }
bsl-metadata = { path = "crates/bsl-metadata" }
bsl-platform = { path = "crates/bsl-platform" }
platform-help = { path = "crates/platform-help" }
html-parser = { path = "crates/bsl-platform/tools/html-parser" }
bsl-types = { path = "crates/bsl-types" }
cfg = { path = "crates/cfg" }
cfg-types = { path = "crates/cfg-types" }
code-chunk = { path = "crates/code-chunk" }
dataflow = { path = "crates/dataflow" }
ide = { path = "crates/ide" }
ide-db = { path = "crates/ide-db" }
ide-host-core = { path = "crates/ide-host-core" }
ide-diagnostics = { path = "crates/ide-diagnostics" }
ide-assists = { path = "crates/ide-assists" }
hir = { path = "crates/hir" }
hir-def = { path = "crates/hir-def" }
hir-ty = { path = "crates/hir-ty" }
sdbl-hir = { path = "crates/sdbl-hir" }
vcs = { path = "crates/vcs" }
vfs = { path = "crates/vfs" }
project-model = { path = "crates/project-model" }
intern = { path = "crates/intern" }
stdx = { path = "crates/stdx" }
profile = { path = "crates/profile" }
test-fixture = { path = "crates/test-fixture" }
test-utils = { path = "crates/test-utils" }
line-index = { path = "crates/line-index" }
paths = { path = "crates/paths" }
vfs-notify = { path = "crates/vfs-notify" }
bsl-launcher = { path = "crates/bsl-launcher" }
bsl-debug = { path = "crates/bsl-debug" }
mcp-server = { path = "crates/mcp-server" }
onec-client = { path = "crates/onec-client" }
bsl-search = { path = "crates/bsl-search" }
naparnik = { path = "crates/naparnik" }
symbol-info = { path = "crates/symbol-info" }

# `salsa_unstable` (already a salsa default feature) gates `Database::memory_usage`,
# used by `RootDatabaseImpl::memory_report` for per-ingredient memory diagnostics.
salsa = { version = "0.28", features = ["rayon", "macros", "salsa_unstable"] }
salsa-macros = "0.28"

lsp-types = "0.95"
lsp-server = "0.7"

rowan = "0.16.1"
logos = "0.14"
text-size = "1.1.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
url = "2.5"
rusqlite = { version = "0.40", features = ["bundled"] }

tokio = { version = "1.35", features = ["full"] }

clap = { version = "4.4", features = ["derive"] }

anyhow = "1.0"
thiserror = "1.0"

# Vendored libgit2 + OpenSSL so git attribute/filter behavior (CRLF, .gitattributes)
# is identical across platforms and independent of any system libgit2.
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }

tracing = { version = "0.1.42", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = [
    "registry",
    "fmt",
    "std",
    "tracing-log",
    "chrono",
] }
tracing-tree = "0.4.0"

rayon = "1.8"

tikv-jemallocator = "0.6"

indicatif = "0.17"

once_cell = "1.19"
dashmap = "5.5"
parking_lot = "0.12"
indexmap = "2.1"
itertools = "0.12"
nucleo-matcher = "0.3"
smol_str = "0.3.2"
boxcar = "0.2"
elsa = "1.10"
la-arena = "0.3"
smallvec = "1.13"
triomphe = { version = "0.1.14", default-features = false, features = ["std"] }
rustc-hash = "2.0"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
jod-thread = "0.1"
libc = "0.2"
regex = "1.10"
unicase = "2.7"
fixedbitset = "0.5"
ordered-float = "5.1"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
walkdir = "2.4"
ignore = "0.4"
spellbook = "0.4"
notify = "6.1"
camino = "1.1"
rust-stemmers = "1.2"

expect-test = "1.4"
tempfile = "3.8"
syn = { version = "2.0", features = ["full", "parsing", "visit"] }
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"

criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.release-with-debug]
inherits = "release"
strip = false
debug = 1

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 3

# Salsa fork (v0.28.0 + fix): an LRU-evicted fixpoint memo re-verified in a later
# revision must re-execute instead of being mistaken for a poisoned cycle head
# (bogus Cancelled::PropagatedPanic that poisons the module until the next write).
# Not fixed upstream as of 0.28.2; branch rebases the one-commit fix onto the tag.
[patch.crates-io]
salsa = { git = "https://github.com/itrous/salsa.git", branch = "fix/evicted-cycle-head-false-panic-v0.28" }
salsa-macros = { git = "https://github.com/itrous/salsa.git", branch = "fix/evicted-cycle-head-false-panic-v0.28" }

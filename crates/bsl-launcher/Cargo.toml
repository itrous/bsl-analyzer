[package]
name = "bsl-launcher"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Lightweight launcher for bsl-analyzer with auto-update and signature verification"

[[bin]]
name = "bsl-analyzer"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.13", features = ["blocking", "rustls"], default-features = false }
webpki-root-certs = "1"
dirs = "6"
anyhow = "1.0"
ed25519-dalek = "2.2"
sha2 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sys-locale = "0.3"
self-replace = "1.5"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true

[package]
name = "mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
bsl-conventions.workspace = true
ide-host-core.workspace = true
bsl-debug.workspace = true
bsl-metadata.workspace = true
naparnik.workspace = true
bsl-platform.workspace = true
bsl-search.workspace = true
onec-client.workspace = true
parser.workspace = true
project-model.workspace = true
sdbl-hir.workspace = true
syntax.workspace = true
profile.workspace = true
line-index.workspace = true
ide.workspace = true
base-db.workspace = true
vcs.workspace = true
salsa.workspace = true
vfs.workspace = true
walkdir.workspace = true
rayon.workspace = true
stdx.workspace = true

rmcp = { version = "3.1", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
# rmcp's per-request cancellation token type (`notifications/cancelled` bridge);
# already in the tree via rmcp itself.
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "tokio",
] }
schemars = "1.2"
tokio = { version = "1", features = [
    "net",
    "rt-multi-thread",
    "sync",
    "macros",
    "io-util",
    "io-std",
    "time",
] }
notify.workspace = true

serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
chrono.workspace = true
dirs = "6"
blake3 = "1.8"
rusqlite.workspace = true
rustc-hash = "2.1"
interprocess = { version = "2.4.2", features = ["tokio"] }

# Broker peer-credential / runtime-dir ownership checks (euid). Unix only;
# already in the tree via interprocess.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tempfile.workspace = true
widestring = "1.0"
win-security-identifier = "0.1.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO"] }
# Safe introspection of a connected named-pipe server: lets us read the
# server PID's image path and owner SID without project-local unsafe or
# handwritten Win32 FFI. `system` feature is Process/System/Users only —
# no CPU/disk/network components pulled in.
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[dev-dependencies]
# Paused time keeps the task-finishing grace independent of blocking-thread scheduling.
tokio = { version = "1", features = ["test-util"] }
test-utils.workspace = true
expect-test.workspace = true
tempfile.workspace = true
# The HTTP suite asserts that a refused request names the allowlist it failed against;
# the field is only observable through a subscriber.
tracing-subscriber.workspace = true
# Client features for integration tests that drive real MCP handshakes through
# the broker and Streamable HTTP transports. Unified with the library's server
# features at build time.
rmcp = { version = "3.1", features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
jsonschema = { version = "0.51.0", default-features = false }
# The one-implementation gate parses Rust sources: a text scan would count the word
# inside comments and doc examples, and this gate exists to be believed.
syn.workspace = true

[lints]
workspace = true
